components:
  parameters:
    IdempotencyKey:
      {
        name: Idempotency-Key,
        in: header,
        required: true,
        schema: { type: string, minLength: 16, maxLength: 128 },
        description: Actor-scoped command replay key; raw value is never logged,
      }
    InvoiceId:
      {
        name: invoiceId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AdjustmentId:
      {
        name: adjustmentId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    RefundId:
      {
        name: refundId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    CreditNoteId:
      {
        name: creditNoteId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  requestBodies:
    VersionedCommand:
      required: true
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [version],
                  properties: { version: { type: integer, minimum: 1 } },
                },
            },
        }
    DecisionCommand:
      required: true
      content:
        {
          application/json:
            {
              schema:
                {
                  type: object,
                  additionalProperties: false,
                  required: [version, reason],
                  properties:
                    {
                      version: { type: integer, minimum: 1 },
                      reason: { type: string, minLength: 3, maxLength: 1000 },
                    },
                },
            },
        }
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    tenantContext:
      {
        type: apiKey,
        in: header,
        name: X-Tenant-Id,
        description: Requested tenant scope; always verified against the authenticated membership,
      }
  schemas:
    CommunicationPreferenceInput:
      type: object
      additionalProperties: false
      properties:
        preferredLocale: { enum: [vi-VN, en-US] }
        preferredTimezone: { type: string }
        emailAddress: { type: string, format: email }
        marketingEmailAllowed: { type: boolean }
        reviewRequestAllowed: { type: boolean }
        serviceRecoveryContactAllowed: { type: boolean }
        quietHoursStart: { type: string }
        quietHoursEnd: { type: string }
        version: { type: integer, minimum: 1 }
    VoucherCampaignInput:
      type: object
      additionalProperties: false
      required:
        [
          name,
          discountType,
          discountValue,
          minimumSpendMinor,
          validFrom,
          validUntil,
        ]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        discountType: { enum: [FIXED, PERCENT] }
        discountValue: { type: integer, minimum: 1 }
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        minimumSpendMinor: { type: integer, minimum: 0 }
        maximumDiscountMinor: { type: integer, minimum: 1 }
        branchIds: { type: array, items: { type: string, format: uuid } }
        serviceIds: { type: array, items: { type: string, format: uuid } }
        customerIds: { type: array, items: { type: string, format: uuid } }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time }
    VoucherCodeIssue:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 4, maxLength: 100, writeOnly: true }
        customerId: { type: string, format: uuid }
        useLimit: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
    LoyaltyAdjustmentInput:
      type: object
      additionalProperties: false
      required: [customerId, pointsDelta, reasonCode, note]
      properties:
        customerId: { type: string, format: uuid }
        pointsDelta: { type: integer, not: { const: 0 } }
        reasonCode: { type: string, minLength: 1, maxLength: 80 }
        note: { type: string, minLength: 3, maxLength: 2000 }
    LoyaltyBenefitCommand:
      type: object
      additionalProperties: false
      required: [version, points]
      properties:
        version: { type: integer, minimum: 1 }
        points:
          {
            type: integer,
            minimum: 1,
            description: Requested points; server caps accepted points at eligible service due before tip,
          }
    LoyaltyReservationContract:
      type: object
      required: [requestedPoints, acceptedPoints, appliedMinor, unusedPoints]
      properties:
        requestedPoints: { type: integer, minimum: 1 }
        acceptedPoints: { type: integer, minimum: 1 }
        appliedMinor: { type: integer, minimum: 1 }
        unusedPoints: { type: integer, minimum: 0 }
    PackageBenefitCommand:
      type: object
      additionalProperties: false
      required: [version, entitlementId, orderLineId, units]
      properties:
        version: { type: integer, minimum: 1 }
        entitlementId: { type: string, format: uuid }
        orderLineId: { type: string, format: uuid }
        units:
          {
            type: integer,
            minimum: 1,
            description: Compatibility assertion only; server derives authoritative units from the matched eligibility item,
          }
    AppointmentPackageReservation:
      type: object
      additionalProperties: false
      required: [entitlementId, appointmentItemId, version]
      properties:
        entitlementId: { type: string, format: uuid }
        appointmentItemId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    PublicPackageReservation:
      type: object
      additionalProperties: false
      required: [entitlementId, appointmentItemId]
      properties:
        entitlementId: { type: string, format: uuid }
        appointmentItemId: { type: string, format: uuid }
    RefundPlanRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 100,
            items:
              {
                type: object,
                additionalProperties: false,
                required: [invoiceLineId, amountMinor],
                properties:
                  {
                    invoiceLineId: { type: string, format: uuid },
                    amountMinor: { type: integer, minimum: 1 },
                  },
              },
          }
        tipAmountMinor: { type: integer, minimum: 0, default: 0 }
        refundDestination:
          {
            type: string,
            enum: [ORIGINAL_TENDER, CUSTOMER_CREDIT],
            default: ORIGINAL_TENDER,
            description: Mutually exclusive refund destination selected during planning; customer credit cannot include tip or payment preferences,
          }
        overrideReason:
          {
            type: string,
            minLength: 3,
            maxLength: 1000,
            description: Required with refund.override_window when the branch-local calendar window has elapsed,
          }
        paymentPreferences:
          {
            type: array,
            items:
              {
                type: object,
                additionalProperties: false,
                required: [paymentId, amountMinor],
                properties:
                  {
                    paymentId: { type: string, format: uuid },
                    amountMinor: { type: integer, minimum: 1 },
                  },
              },
          }
    RefundCreateRequest:
      allOf:
        - { $ref: "#/components/schemas/RefundPlanRequest" }
        - {
            type: object,
            additionalProperties: false,
            required: [reasonCode, reasonText],
            properties:
              {
                reasonCode: { type: string, maxLength: 80 },
                reasonText: { type: string, minLength: 3, maxLength: 2000 },
              },
          }
    CashRefundExecution:
      type: object
      additionalProperties: false
      required: [version, cashSessionId]
      properties:
        {
          version: { type: integer, minimum: 1 },
          cashSessionId: { type: string, format: uuid },
        }
    ExternalRefundExecution:
      type: object
      additionalProperties: false
      required: [version, provider, providerRefundId, processedAt, evidenceNote]
      properties:
        {
          version: { type: integer, minimum: 1 },
          provider: { type: string },
          providerRefundId: { type: string },
          processedAt: { type: string, format: date-time },
          evidenceNote: { type: string, minLength: 3 },
        }
    CommissionRuleRequest:
      type: object
      additionalProperties: false
      required: [ruleCode, ruleType, baseMode, priority, effectiveFrom]
      properties:
        {
          branchId: { type: string, format: uuid },
          staffId: { type: string, format: uuid },
          serviceId: { type: string, format: uuid },
          ruleCode: { type: string },
          ruleType: { enum: [SERVICE_PERCENT, SERVICE_FIXED] },
          baseMode:
            {
              enum:
                [
                  NET_SERVICE_AFTER_DISCOUNT_BEFORE_TAX,
                  GROSS_SERVICE_BEFORE_DISCOUNT,
                  FIXED_PER_COMPLETED_SERVICE,
                ],
            },
          percentBasisPoints: { type: integer, minimum: 0, maximum: 10000 },
          fixedMinor: { type: integer, minimum: 0 },
          currency: { type: string, pattern: "^[A-Z]{3}$" },
          priority: { type: integer },
          effectiveFrom: { type: string, format: date-time },
          effectiveTo: { type: string, format: date-time },
          policy: { type: object },
        }
    VersionCommand:
      type: object
      additionalProperties: false
      required: [version]
      properties: { version: { type: integer, minimum: 1 } }
    AssignRegister:
      type: object
      additionalProperties: false
      required: [version, registerId]
      properties:
        version: { type: integer, minimum: 1 }
        registerId: { type: string, format: uuid }
    PosOrderCreate:
      type: object
      additionalProperties: false
      properties: { registerId: { type: string, format: uuid } }
    DiscountCommand:
      type: object
      additionalProperties: false
      required: [version, discountType, value, reasonCode]
      properties:
        version: { type: integer, minimum: 1 }
        orderLineId: { type: string, format: uuid }
        discountType: { enum: [FIXED, PERCENT] }
        value: { type: number, minimum: 0, maximum: 10000 }
        reasonCode: { type: string, minLength: 1, maxLength: 80 }
        note: { type: string, maxLength: 1000 }
    TipCommand:
      type: object
      additionalProperties: false
      required: [version, amountMinor, allocationBasis]
      properties:
        version: { type: integer, minimum: 1 }
        amountMinor: { type: integer, minimum: 0 }
        source: { enum: [CUSTOMER, CASHIER_ENTRY, TERMINAL] }
        allocationBasis: { enum: [MANUAL, EQUAL, WORK_SECONDS] }
        allocations:
          {
            type: array,
            items:
              {
                type: object,
                required: [staffId, amountMinor],
                properties:
                  {
                    staffId: { type: string, format: uuid },
                    appointmentItemId: { type: string, format: uuid },
                    amountMinor: { type: integer, minimum: 0 },
                  },
              },
          }
    PaymentCommand:
      oneOf:
        - { $ref: "#/components/schemas/CashPayment" }
        - { $ref: "#/components/schemas/ExternalCardPayment" }
        - { $ref: "#/components/schemas/BankTransferPayment" }
    CashPayment:
      type: object
      additionalProperties: false
      required:
        [
          version,
          tenderType,
          amountToApplyMinor,
          cashReceivedMinor,
          cashSessionId,
        ]
      properties:
        {
          version: { type: integer, minimum: 1 },
          tenderType: { const: CASH },
          amountToApplyMinor: { type: integer, minimum: 1 },
          cashReceivedMinor: { type: integer, minimum: 1 },
          cashSessionId: { type: string, format: uuid },
        }
    ExternalCardPayment:
      type: object
      additionalProperties: false
      required:
        [
          version,
          tenderType,
          amountToApplyMinor,
          provider,
          providerTransactionId,
        ]
      properties:
        {
          version: { type: integer, minimum: 1 },
          tenderType: { const: CARD_EXTERNAL },
          amountToApplyMinor: { type: integer, minimum: 1 },
          provider: { type: string },
          providerTransactionId: { type: string },
          terminalId: { type: string },
          cardBrand: { type: string },
          cardLast4: { type: string, pattern: "^[0-9]{4}$" },
          approvalCode: { type: string },
        }
    BankTransferPayment:
      type: object
      additionalProperties: false
      required:
        [
          version,
          tenderType,
          amountToApplyMinor,
          providerTransactionId,
          receivedAt,
          evidenceNote,
        ]
      properties:
        {
          version: { type: integer, minimum: 1 },
          tenderType: { const: BANK_TRANSFER },
          amountToApplyMinor: { type: integer, minimum: 1 },
          providerTransactionId: { type: string },
          receivedAt: { type: string, format: date-time },
          evidenceNote: { type: string },
        }
    CashSessionOpen:
      type: object
      additionalProperties: false
      required: [registerId, cashDrawerId, openingFloatMinor]
      properties:
        {
          registerId: { type: string, format: uuid },
          cashDrawerId: { type: string, format: uuid },
          openingFloatMinor: { type: integer, minimum: 0 },
          deviceId:
            {
              type: string,
              deprecated: true,
              description: Compatibility-only input; ignored for authorization. The server resolves device_id from auth.sessionId.,
            },
        }
    Reconciliation:
      type: object
      required:
        [
          paidOrderCount,
          serviceSalesMinor,
          discountMinor,
          taxMinor,
          tipMinor,
          serviceCollectedMinor,
          tipCollectedMinor,
          totalCollectedMinor,
          paymentMix,
          cashExpectedMinor,
          cashDeclaredMinor,
          cashVarianceMinor,
          filters,
        ]
      properties:
        paidOrderCount: { type: integer, minimum: 0 }
        serviceSalesMinor: { type: integer }
        discountMinor: { type: integer }
        taxMinor: { type: integer }
        tipMinor: { type: integer }
        serviceCollectedMinor: { type: integer }
        tipCollectedMinor: { type: integer }
        totalCollectedMinor: { type: integer }
        paymentMix: { type: object }
        cashExpectedMinor: { type: integer }
        cashDeclaredMinor: { type: integer }
        cashVarianceMinor: { type: integer }
        filters:
          type: object
          properties:
            branchId: { type: string, format: uuid }
            businessDate: { type: string, format: date }
            registerId: { type: [string, "null"], format: uuid }
            cashierUserId: { type: [string, "null"], format: uuid }
            cashierSemantics: { const: PAYMENT_CAPTURE_ACTOR }
    WalkInCreate:
      type: object
      required: [branchId, displayName, items]
      properties:
        branchId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 32 }
        email: { type: string, format: email }
        source: { enum: [RECEPTION, KIOSK, QR, MOBILE], default: RECEPTION }
        items:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: object
            required: [serviceId, staffPreference]
            properties:
              serviceId: { type: string, format: uuid }
              staffPreference:
                type: object
                required: [type]
                properties:
                  type: { enum: [ANY, SPECIFIC] }
                  staffId: { type: string, format: uuid }
    WalkInEstimate:
      type: object
      required:
        [
          estimateGeneratedAt,
          estimateDisclaimer,
          estimateConfidence,
          estimateReasonCodes,
        ]
      properties:
        estimatedStartAt: { type: string, format: date-time, nullable: true }
        estimatedWaitMinutes: { type: integer, minimum: 0, nullable: true }
        estimateGeneratedAt: { type: string, format: date-time }
        estimateDisclaimer: { const: ESTIMATED_NOT_GUARANTEED }
        estimateConfidence: { enum: [LOW, MEDIUM, HIGH] }
        estimateReasonCodes:
          type: array
          items: { type: string }
        eligibleStaffCount: { type: integer, minimum: 0 }
        queueAheadCount: { type: integer, minimum: 0 }
        queuedWorkMinutes: { type: integer, minimum: 0 }
    WalkInEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          allOf:
            - { type: object }
            - { $ref: "#/components/schemas/WalkInEstimate" }
    MediaUploadReportedEnvelope:
      type: object
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [id, status, verification]
          properties:
            id: { type: string, format: uuid }
            status: { const: PENDING_UPLOAD }
            verification: { const: TRUSTED_PROVIDER_CALLBACK }
    AvailabilityExplainRequest:
      type: object
      required: [branchId, serviceId, startAt]
      properties:
        branchId: { type: string, format: uuid }
        serviceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        staffId: { type: string, format: uuid }
    AvailabilityReason:
      type: object
      required: [code, count]
      properties:
        code: { type: string }
        count: { type: integer, minimum: 1 }
    AvailabilityExplainResponse:
      type: object
      required:
        [
          available,
          startAt,
          timezone,
          blockingReasons,
          warnings,
          rules,
          resourceSummary,
          staffCandidates,
        ]
      properties:
        available: { type: boolean }
        startAt: { type: string, format: date-time }
        timezone: { type: string }
        reasons:
          type: array
          deprecated: true
          description: Backward-compatible alias of blockingReasons.
          items: { $ref: "#/components/schemas/AvailabilityReason" }
        blockingReasons:
          type: array
          items: { $ref: "#/components/schemas/AvailabilityReason" }
        warnings:
          type: array
          description: Non-blocking diagnostics such as partial RESOURCE_MAINTENANCE or offset-explicit DST_AMBIGUOUS.
          items: { $ref: "#/components/schemas/AvailabilityReason" }
        rules:
          type: object
          required: [businessHours, staff, resources, price, timezone]
          properties:
            businessHours: { type: boolean }
            staff: { type: boolean }
            resources: { type: boolean }
            price: { type: boolean }
            timezone: { type: boolean }
        resourceSummary: { type: array, items: { type: object } }
        staffCandidates: { type: array, items: { type: object } }
    AvailabilityBlockInput:
      type: object
      required: [branchId, blockType, title, startAt, endAt]
      properties:
        branchId: { type: string, format: uuid }
        staffId: { type: string, format: uuid }
        resourceId: { type: string, format: uuid }
        blockType: { enum: [MANUAL, EXTERNAL, MAINTENANCE] }
        title: { type: string, maxLength: 200 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        source: { type: string }
        sourceReference: { type: string }
        notes: { type: string }
    StaffPreference:
      oneOf:
        - {
            type: object,
            required: [type],
            properties: { type: { const: ANY } },
          }
        - {
            type: object,
            required: [type, staffId],
            properties:
              {
                type: { const: SPECIFIC },
                staffId: { type: string, format: uuid },
              },
          }
    BookingPlanRequest:
      type: object
      required: [branchId, desiredStartAt, items]
      properties:
        branchId: { type: string, format: uuid }
        desiredStartAt: { type: string, format: date-time }
        items:
          {
            type: array,
            minItems: 1,
            maxItems: 5,
            items:
              {
                type: object,
                required: [serviceId, staffPreference],
                properties:
                  {
                    serviceId: { type: string, format: uuid },
                    staffPreference:
                      { $ref: "#/components/schemas/StaffPreference" },
                    availabilityFingerprint:
                      { type: string, minLength: 64, maxLength: 64 },
                  },
              },
          }
    CreateSlotHoldRequest:
      allOf:
        - { $ref: "#/components/schemas/BookingPlanRequest" }
        - {
            type: object,
            properties:
              {
                availabilityDataVersion: { type: integer, minimum: 1 },
                clientKey: { type: string },
                source: { enum: [CUSTOMER_WEB, RECEPTION, OWNER_MOBILE, API] },
              },
          }
    CreateAppointmentRequest:
      type: object
      required: [holdId, customer]
      properties:
        holdId: { type: string, format: uuid }
        holdToken: { type: string, writeOnly: true }
        contactVerificationToken: { type: string, writeOnly: true }
        customer:
          {
            type: object,
            properties:
              {
                customerId: { type: string, format: uuid },
                displayName: { type: string },
                phone: { type: string },
                email: { type: string, format: email },
                locale: { enum: [vi-VN, en-US] },
              },
          }
        customerNote: { type: string, maxLength: 2000 }
        internalNote: { type: string, maxLength: 4000 }
        marketingConsent: { type: boolean, default: false }
        confirm: { type: boolean, default: true }
    BookingCustomerInput:
      type: object
      additionalProperties: false
      required: [displayName, locale]
      anyOf: [{ required: [phone] }, { required: [email] }]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, maxLength: 32 }
        email: { type: string, format: email, maxLength: 254 }
        locale: { enum: [vi-VN, en-US] }
    BookingCustomer:
      type: object
      required: [id, displayName, locale, status, isGuest]
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        phone: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        locale: { enum: [vi-VN, en-US] }
        status: { enum: [ACTIVE, INACTIVE, MERGED] }
        isGuest: { type: boolean }
        idempotencyReplayed: { type: boolean }
    PublicCreateAppointmentRequest:
      type: object
      additionalProperties: false
      required:
        [
          holdId,
          holdToken,
          customer,
          contactVerificationToken,
          marketingConsent,
          acceptedPolicyVersion,
          acceptedAt,
        ]
      properties:
        holdId: { type: string, format: uuid }
        holdToken: { type: string, minLength: 1, writeOnly: true }
        contactVerificationToken:
          { type: string, minLength: 1, writeOnly: true }
        customer:
          type: object
          additionalProperties: false
          required: [displayName, locale]
          anyOf: [{ required: [phone] }, { required: [email] }]
          properties:
            displayName: { type: string, minLength: 1, maxLength: 200 }
            phone: { type: string, maxLength: 32 }
            email: { type: string, format: email, maxLength: 254 }
            locale: { enum: [vi-VN, en-US] }
        customerNote: { type: string, maxLength: 2000 }
        marketingConsent: { type: boolean }
        acceptedPolicyVersion: { type: integer, minimum: 1 }
        acceptedAt: { type: string, format: date-time }
    RescheduleRequest:
      type: object
      required: [version, replacementHoldId, reasonCode]
      properties:
        {
          version: { type: integer, minimum: 1 },
          replacementHoldId: { type: string, format: uuid },
          replacementHoldToken: { type: string, writeOnly: true },
          reasonCode: { type: string },
          note: { type: string },
        }
    CancelRequest:
      type: object
      required: [version, reasonCode]
      properties:
        {
          version: { type: integer, minimum: 1 },
          reasonCode: { type: string },
          note: { type: string },
          actorType: { enum: [USER, CUSTOMER], default: USER },
          policyOverrideReason: { type: string },
        }
    LoginRequest:
      type: object
      required: [tenantSlug, email, password, deviceId, deviceName, platform]
      properties:
        tenantSlug: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        deviceId: { type: string }
        deviceName: { type: string }
        platform: { enum: [web, ios, android] }
    LeaveRequestInput:
      type: object
      required: [staffId, branchId, startAt, endAt]
      properties:
        staffId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        leaveType: { enum: [PERSONAL, SICK, ANNUAL, UNPAID, OTHER] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string, nullable: true }
    HealthResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { const: true }
        data:
          {
            type: object,
            required: [status, service],
            properties: { status: { const: ok }, service: { const: api } },
          }
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      required: [requestId, timestamp]
      properties:
        {
          requestId: { type: string },
          timestamp: { type: string, format: date-time },
        }
