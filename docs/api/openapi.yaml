openapi: 3.1.0
info:
  {
    title: Nailsoft API,
    version: 0.13.0,
    description: Sprint 11 email communication consent marketing reviews and service recovery plus Sprint 10 gift card and customer credit stored-value operations plus Sprint 9 inventory,
    supplier and purchase operations plus Sprint 8 voucher,
    loyalty,
    membership and service package benefits plus Sprint 7 refund,
    credit note,
    commission and financial reporting plus Sprint 6 POS with authenticated-device register trust,
    invoice,
    payment,
    tip and cash-session API plus Sprint 5 operations and prior booking lifecycle,
    public booking,
    availability and calendar API,
  }
servers: [{ url: http://localhost:3001/v1 }]
security: [{ bearerAuth: [], tenantContext: [] }]
paths:
  /customer/me/communication-preferences:
    get:
      {
        tags: [communication],
        summary: Read own communication preferences,
        responses: { "200": { description: Preferences } },
      }
  /customer/me/communication-preferences/update:
    post:
      {
        tags: [communication],
        summary: Update own email preferences,
        requestBody:
          {
            required: true,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        $ref: "#/components/schemas/CommunicationPreferenceInput",
                      },
                  },
              },
          },
        responses: { "200": { description: Updated } },
      }
  /customer/me/consents:
    get:
      {
        tags: [communication],
        summary: Read own versioned consent states,
        responses: { "200": { description: Consent states } },
      }
  /customer/me/consents/grant:
    post:
      {
        tags: [communication],
        summary: Append consent grant evidence,
        responses:
          {
            "200": { description: Granted },
            "409": { description: Definition inactive or version conflict },
          },
      }
  /customer/me/consents/withdraw:
    post:
      {
        tags: [communication],
        summary: Withdraw and immediately suppress marketing,
        responses: { "200": { description: Withdrawn } },
      }
  /communications/templates:
    get:
      {
        tags: [communication],
        summary: List templates,
        responses: { "200": { description: Templates } },
      }
    post:
      {
        tags: [communication],
        summary: Create email template,
        responses: { "200": { description: Created } },
      }
  /communications/messages:
    get:
      {
        tags: [communication],
        summary: List privacy-safe delivery records,
        responses: { "200": { description: Messages } },
      }
  /customer-segments:
    get:
      {
        tags: [marketing],
        summary: List scoped segments,
        responses: { "200": { description: Segments } },
      }
    post:
      {
        tags: [marketing],
        summary: Create allowlisted segment,
        responses: { "200": { description: Created } },
      }
  /marketing-campaigns:
    get:
      {
        tags: [marketing],
        summary: List scoped email campaigns,
        responses: { "200": { description: Campaigns } },
      }
    post:
      {
        tags: [marketing],
        summary: Create email campaign,
        responses: { "200": { description: Created } },
      }
  /marketing-campaigns/{campaignId}/approve:
    post:
      {
        tags: [marketing],
        summary: Dual-control campaign approval,
        parameters:
          [
            {
              in: path,
              name: campaignId,
              required: true,
              schema: { type: string, format: uuid },
            },
          ],
        responses:
          {
            "200": { description: Approved },
            "403": { description: Self approval denied },
          },
      }
  /review-requests:
    get:
      {
        tags: [reviews],
        summary: List verified-transaction review requests,
        responses: { "200": { description: Requests } },
      }
  /reviews:
    get:
      {
        tags: [reviews],
        summary: List scoped verified reviews,
        responses: { "200": { description: Reviews } },
      }
  /public/reviews/request:
    get:
      security: []
      tags: [reviews]
      summary: Read a signed review request
      parameters:
        [{ in: query, name: token, required: true, schema: { type: string } }]
      responses:
        {
          "200": { description: Public review context },
          "404": { description: Invalid token },
        }
  /public/reviews/submit:
    post:
      security: []
      tags: [reviews]
      summary: Submit one paid-visit review
      responses:
        {
          "200": { description: Submitted },
          "409": { description: Unverified or already submitted },
        }
  /public/communications/unsubscribe:
    post:
      security: []
      tags: [communication]
      summary: Immediately withdraw marketing consent
      responses:
        {
          "200": { description: Suppressed },
          "404": { description: Invalid token },
        }
  /service-recovery/cases:
    get:
      {
        tags: [service-recovery],
        summary: List branch-scoped recovery cases,
        responses: { "200": { description: Cases } },
      }
    post:
      {
        tags: [service-recovery],
        summary: Create a recovery case,
        responses: { "200": { description: Created } },
      }
  /service-recovery/cases/{caseId}/triage:
    post:
      {
        tags: [service-recovery],
        summary: Triage a recovery case,
        parameters:
          [
            {
              in: path,
              name: caseId,
              required: true,
              schema: { type: string, format: uuid },
            },
          ],
        responses:
          {
            "200": { description: Triaged },
            "409": { description: Version or state conflict },
          },
      }
  /service-recovery/tasks/me:
    get:
      {
        tags: [service-recovery],
        summary: List recovery tasks assigned to the current user,
        responses: { "200": { description: Assigned tasks } },
      }
  /service-recovery/compensations:
    get:
      {
        tags: [service-recovery],
        summary: List branch-scoped compensation requests pending approval,
        responses: { "200": { description: Pending compensation requests } },
      }
  /service-recovery/compensations/{compensationId}/approve:
    post:
      {
        tags: [service-recovery],
        summary: Dual-control compensation approval through owning domain,
        parameters:
          [
            {
              in: path,
              name: compensationId,
              required: true,
              schema: { type: string, format: uuid },
            },
          ],
        responses:
          {
            "200": { description: Approved },
            "403": { description: Self approval denied },
          },
      }
  /gift-card-products:
    get:
      {
        tags: [stored-value],
        summary: List versioned gift-card products,
        responses: { "200": { description: Products } },
      }
    post:
      {
        tags: [stored-value],
        summary: Create draft gift-card product,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          { "200": { description: Created }, "409": { description: Conflict } },
      }
  /gift-card-products/{productId}:
    get:
      {
        tags: [stored-value],
        summary: Get gift-card product,
        responses:
          {
            "200": { description: Product },
            "404": { description: Not found },
          },
      }
  /gift-card-products/{productId}/activate:
    post:
      {
        tags: [stored-value],
        summary: Activate product version,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Activated },
            "409": { description: Version conflict },
          },
      }
  /gift-card-products/{productId}/supersede:
    post:
      {
        tags: [stored-value],
        summary: Supersede immutable product policy,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Superseded } },
      }
  /gift-cards:
    get:
      {
        tags: [stored-value],
        summary: List tenant-scoped masked gift cards,
        responses: { "200": { description: Cards } },
      }
  /gift-cards/lookup:
    post:
      {
        tags: [stored-value],
        summary: Rate-limited masked card lookup,
        responses:
          {
            "200": { description: Masked card and balance },
            "409": { description: Invalid or locked },
          },
      }
  /gift-cards/{giftCardId}:
    get:
      {
        tags: [stored-value],
        summary: Get masked gift-card detail,
        responses: { "200": { description: Card } },
      }
  /gift-cards/{giftCardId}/balance:
    get:
      {
        tags: [stored-value],
        summary: Get authoritative balance projection,
        responses: { "200": { description: Balance } },
      }
  /gift-cards/{giftCardId}/ledger:
    get:
      {
        tags: [stored-value],
        summary: Get append-only ledger,
        responses: { "200": { description: Ledger } },
      }
  /gift-cards/{giftCardId}/suspend:
    post:
      {
        tags: [stored-value],
        summary: Suspend active card,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Suspended } },
      }
  /gift-cards/{giftCardId}/reactivate:
    post:
      {
        tags: [stored-value],
        summary: Reactivate suspended card,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Active } },
      }
  /gift-cards/{giftCardId}/cancel:
    post:
      {
        tags: [stored-value],
        summary: Cancel card without deleting history,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Cancelled } },
      }
  /gift-cards/{giftCardId}/replace:
    post:
      {
        tags: [stored-value],
        summary: Atomically replace and transfer liability,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          { "200": { description: Replacement credentials returned once } },
      }
  /gift-cards/{giftCardId}/reload:
    post:
      {
        tags: [stored-value],
        summary: Reload from captured funding payment,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Reloaded } },
      }
  /pos-orders/{orderId}/gift-card-lines:
    post:
      {
        tags: [stored-value],
        summary: Add non-discountable gift-card funding line,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200":
              { description: Pending activation and display-once credentials },
          },
      }
  /pos-orders/{orderId}/stored-value/eligibility:
    get:
      {
        tags: [stored-value],
        summary: Get server-derived eligible due excluding tip and gift-card lines,
        responses: { "200": { description: Eligibility } },
      }
  /pos-orders/{orderId}/stored-value:
    get:
      {
        tags: [stored-value],
        summary: List order stored-value applications,
        responses: { "200": { description: Applications } },
      }
  /pos-orders/{orderId}/stored-value/gift-card:
    post:
      {
        tags: [stored-value],
        summary: Reserve gift-card balance online,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Reservation },
            "409": { description: Balance or version conflict },
          },
      }
  /pos-orders/{orderId}/stored-value/customer-credit:
    post:
      {
        tags: [stored-value],
        summary: Reserve customer-bound credit online,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Reservation } },
      }
  /pos-orders/{orderId}/stored-value/{applicationId}/release:
    post:
      {
        tags: [stored-value],
        summary: Release active reservation,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Released } },
      }
  /customers/{customerId}/customer-credit:
    get:
      {
        tags: [stored-value],
        summary: Get customer-bound credit,
        responses: { "200": { description: Credit accounts } },
      }
  /stored-value-adjustments:
    get:
      {
        tags: [stored-value],
        summary: List dual-control adjustments,
        responses: { "200": { description: Adjustments } },
      }
    post:
      {
        tags: [stored-value],
        summary: Request customer credit adjustment,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Pending adjustment } },
      }
  /stored-value-adjustments/{id}/approve:
    post:
      {
        tags: [stored-value],
        summary: Independently approve and post adjustment,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Posted },
            "409": { description: Self-approval or version conflict },
          },
      }
  /refunds/{refundId}/stored-value-plan:
    post:
      {
        tags: [stored-value],
        summary: Preview exact original stored-value allocation,
        responses: { "200": { description: Plan } },
      }
  /refunds/{refundId}/issue-customer-credit:
    post:
      {
        tags: [stored-value],
        summary: Issue approved refund destination to customer credit,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Credit issued } },
      }
  /customer/me/gift-cards:
    get:
      {
        tags: [customer-wallet],
        summary: List own assigned gift cards,
        responses: { "200": { description: Own cards } },
      }
  /customer/me/customer-credit:
    get:
      {
        tags: [customer-wallet],
        summary: Get own customer credit,
        responses: { "200": { description: Own credit } },
      }
  /customer/me/stored-value-history:
    get:
      {
        tags: [customer-wallet],
        summary: Get own stored-value history,
        responses: { "200": { description: Own history } },
      }
  /stored-value/reports/{kind}:
    get:
      {
        tags: [stored-value],
        summary: Liability issuance redemption aging or reconciliation report,
        responses: { "200": { description: Report } },
      }
  /inventory/items:
    get:
      {
        tags: [inventory],
        summary: List tenant inventory items,
        responses: { "200": { description: Items } },
      }
    post:
      {
        tags: [inventory],
        summary: Create an inventory item,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Created },
            "409": { description: Idempotency or SKU conflict },
          },
      }
  /inventory/items/{itemId}:
    get:
      {
        tags: [inventory],
        summary: Get an inventory item,
        responses:
          { "200": { description: Item }, "404": { description: Not found } },
      }
  /inventory/locations:
    get:
      {
        tags: [inventory],
        summary: List branch stock locations,
        responses: { "200": { description: Locations } },
      }
    post:
      {
        tags: [inventory],
        summary: Create a stock location,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Created } },
      }
  /inventory/stock:
    get:
      {
        tags: [inventory],
        summary: Read on-hand reserved and available stock without cost,
        responses: { "200": { description: Stock rows } },
      }
  /inventory/ledger:
    get:
      {
        tags: [inventory],
        summary: Read append-only stock ledger,
        responses: { "200": { description: Ledger entries } },
      }
  /inventory/purchase-orders:
    get:
      {
        tags: [inventory],
        summary: List purchase orders,
        responses: { "200": { description: Purchase orders } },
      }
    post:
      {
        tags: [inventory],
        summary: Create purchase order,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Created } },
      }
  /inventory/purchase-orders/{poId}/approve:
    post:
      {
        tags: [inventory],
        summary: Approve a submitted purchase order,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Approved },
            "409": { description: Version or state conflict },
          },
      }
  /inventory/receipts:
    get:
      {
        tags: [inventory],
        summary: List goods receipts,
        responses: { "200": { description: Receipts } },
      }
    post:
      {
        tags: [inventory],
        summary: Create a draft receipt,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Draft created } },
      }
  /inventory/receipts/{receiptId}/post:
    post:
      {
        tags: [inventory],
        summary: Post an immutable receipt and stock ledger entries,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Posted },
            "409": { description: State conflict },
          },
      }
  /inventory/transfers:
    get:
      {
        tags: [inventory],
        summary: List branch transfers,
        responses: { "200": { description: Transfers } },
      }
    post:
      {
        tags: [inventory],
        summary: Create a stock transfer,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Created } },
      }
  /inventory/counts:
    get:
      {
        tags: [inventory],
        summary: List blind count sessions,
        responses: { "200": { description: Counts } },
      }
    post:
      {
        tags: [inventory],
        summary: Create a blind count,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Created } },
      }
  /service-sessions/{sessionId}/materials/reserve:
    post:
      {
        tags: [inventory],
        summary: Reserve service recipe materials using FEFO,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Reserved or shortage } },
      }
  /service-sessions/{sessionId}/materials:
    get:
      {
        tags: [inventory],
        summary: Read tenant and staff-scoped material reservation state,
        responses:
          {
            "200": { description: Material reservation and lines },
            "404": { description: Session not visible },
          },
      }
  /service-sessions/{sessionId}/materials/actual-usage:
    post:
      {
        tags: [inventory],
        summary: Record actual material usage without posting stock,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Actual usage recorded },
            "409": { description: Version or override-reason conflict },
          },
      }
  /service-sessions/{sessionId}/materials/consume:
    post:
      {
        tags: [inventory],
        summary: Commit actual material consumption,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Consumed } },
      }
  /service-sessions/{sessionId}/materials/commit:
    post:
      {
        tags: [inventory],
        summary: Commit actual material usage to the immutable ledger,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Committed },
            "409": { description: Version, stock, or state conflict },
          },
      }
  /service-sessions/{sessionId}/materials/release:
    post:
      {
        tags: [inventory],
        summary: Release uncommitted material reservations,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Released } },
      }
  /service-sessions/{sessionId}/materials/override-shortage:
    post:
      {
        tags: [inventory],
        summary: Record authorized shortage override for manual review,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses:
          {
            "200": { description: Override recorded },
            "409": { description: Reason, version, or state conflict },
          },
      }
  /pos/orders/{orderId}/products:
    post:
      {
        tags: [inventory],
        summary: Add and reserve a retail product line,
        parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }],
        responses: { "200": { description: Product line added } },
      }
  /auth/login:
    post:
      tags: [authentication]
      security: []
      summary: Create a device session
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/LoginRequest" } },
            },
        }
      responses:
        {
          "200": { description: Authenticated },
          "401": { description: Invalid credentials },
        }
  /auth/refresh:
    post:
      tags: [authentication]
      security: []
      summary: Rotate a refresh token
      responses:
        {
          "200": { description: Rotated },
          "409": { description: Token reuse detected },
        }
  /auth/sessions:
    get:
      {
        tags: [authentication],
        summary: List own active device sessions,
        responses: { "200": { description: Sessions } },
      }
  /auth/select-workspace:
    post:
      {
        tags: [authentication],
        security: [],
        summary: Select an active tenant membership,
        responses:
          {
            "200": { description: Workspace session created },
            "401": { description: Workspace unavailable },
          },
      }
  /auth/logout:
    post:
      {
        tags: [authentication],
        summary: Revoke current device and clear Web cookies,
        responses: { "204": { description: Logged out } },
      }
  /auth/sessions/{id}/revoke:
    post:
      tags: [authentication]
      summary: Revoke an own device session
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses: { "204": { description: Revoked } }
  /organization:
    get:
      {
        tags: [organization],
        summary: Read salon configuration,
        responses: { "200": { description: Organization } },
      }
    patch:
      {
        tags: [organization],
        summary: Update salon configuration,
        responses: { "200": { description: Updated } },
      }
  /branches:
    get:
      {
        tags: [organization],
        summary: List authorized branches,
        responses: { "200": { description: Branch list } },
      }
    post:
      {
        tags: [organization],
        summary: Create a branch,
        responses: { "201": { description: Created } },
      }
  /branches/{id}:
    get:
      tags: [organization]
      summary: Read an authorized branch
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200": { description: Branch },
          "403": { description: Outside branch scope },
        }
    patch:
      tags: [organization]
      summary: Update an authorized branch
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses: { "200": { description: Updated } }
  /branches/{id}/business-hours:
    get:
      {
        tags: [organization],
        summary: Read business hours,
        parameters:
          [
            {
              name: id,
              in: path,
              required: true,
              schema: { type: string, format: uuid },
            },
          ],
        responses: { "200": { description: Hours } },
      }
    put:
      {
        tags: [organization],
        summary: Replace weekly business hours,
        parameters:
          [
            {
              name: id,
              in: path,
              required: true,
              schema: { type: string, format: uuid },
            },
          ],
        responses: { "200": { description: Updated } },
      }
  /users:
    get:
      {
        tags: [users],
        summary: List users in authorized scope,
        responses: { "200": { description: Users } },
      }
    post:
      {
        tags: [users],
        summary: Create a tenant and branch-scoped user,
        responses: { "201": { description: Created } },
      }
  /users/{membershipId}/access:
    patch:
      {
        tags: [users],
        summary: Replace membership roles branches and status,
        parameters:
          [
            {
              name: membershipId,
              in: path,
              required: true,
              schema: { type: string, format: uuid },
            },
          ],
        responses:
          {
            "200": { description: Access updated },
            "409": { description: Last owner or invalid branch },
          },
      }
  /users/{membershipId}/sessions:
    get:
      {
