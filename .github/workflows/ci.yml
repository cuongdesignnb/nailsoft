      - name: Sprint 11 compensation posting integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint11-review-compensation-correctness.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 12 workforce payroll PostgreSQL concurrency and authenticated API
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            tests/integration/sprint12-workforce-payroll-invariants.test.ts \
