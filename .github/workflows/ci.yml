      - name: Sprint 6 authenticated POS and mobile E2E
        run: pnpm db:reset && pnpm db:seed && pnpm exec playwright test tests/e2e/sprint6-pos-ui.spec.ts
      - name: Sprint 19 Wave 2 POS payment and cash authenticated E2E
        run: pnpm db:reset && pnpm db:seed && pnpm exec playwright test tests/e2e/sprint19-wave2-pos-cash.spec.ts --config=playwright.config.ts
