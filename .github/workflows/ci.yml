name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    # Full Sprint 1-15 regression intentionally runs serial database resets,
    # authenticated E2E and every load-smoke lane. Keep the assertions and
    # load steps unchanged; allow enough wall-clock time for the complete job.
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_DB: nailsoft,
            POSTGRES_USER: nailsoft,
            POSTGRES_PASSWORD: nailsoft,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nailsoft -d nailsoft"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://nailsoft:nailsoft@localhost:5432/nailsoft
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-high-entropy-secret-change-me-2026
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3002,http://127.0.0.1:3002
    steps:
      - uses: actions/checkout@v4
      # pnpm 11 requires Node >=22.13 (node:sqlite). Initialize Node first so
      # pnpm/action-setup executes the package manager with the supported runtime.
      - uses: actions/setup-node@v4
        with: { node-version: 22.14.0 }
      - uses: pnpm/action-setup@v4
        with: { version: 11.7.0 }
      - run: pnpm install --frozen-lockfile
      - name: Configure PostgreSQL lock budget
        shell: bash
        run: |
          container=$(docker ps --filter "name=postgres" --format '{{.ID}}' | head -n 1)
          test -n "$container"
          docker exec "$container" psql -U nailsoft -d nailsoft -c "ALTER SYSTEM SET max_locks_per_transaction='512';"
          docker restart "$container"
          for i in $(seq 1 30); do
            docker exec "$container" pg_isready -U nailsoft -d nailsoft && break
            sleep 2
          done
      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 40 lint.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Lint::$line"
            done
          fi
          exit "$status"
      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 typecheck.log | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=Typecheck::$line"
            done
          fi
          exit "$status"
      - name: Fresh database migration
        run: pnpm db:migrate
      - name: Sprint 13 migration 0027 rollback to 0026 and re-migrate
        run: pnpm db:rollback && pnpm db:migrate
      - name: Deterministic seed
        run: pnpm db:seed
      - name: Unit tests
        run: pnpm test:unit
      - name: Public booking policy and capability unit tests
        run: pnpm exec vitest run apps/api/test/public-booking-policy.test.ts apps/api/test/booking-idempotency.test.ts apps/api/test/booking-token.test.ts packages/validation/src/index.test.ts
      - name: Sprint 1-6 PostgreSQL and concurrency integration
        run: pnpm test:integration
      - name: Sprint 5 operational authorization integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint5-closure-authorization.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 5 ETA and timezone integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint5-eta-timezone.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 6 payment and cash concurrency integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint6-pos-payment-cash.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 6 register/device authorization integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint6-register-device-binding.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 6 cash attribution and reconciliation integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint6-register-cash-attribution.test.ts tests/integration/sprint6-reconciliation-filters.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 6 blind count integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint6-blind-cash-count.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 7 refund, commission, locked-period and security integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint7-refund-commission.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 7 financial correctness closure integration
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            tests/integration/sprint7-cash-refund-register.test.ts \
            tests/integration/sprint7-tip-version-integrity.test.ts \
            tests/integration/sprint7-adjustment-posting.test.ts \
            tests/integration/sprint7-period-statement-lock.test.ts \
            tests/integration/sprint7-refund-window-numbering.test.ts \
            tests/integration/sprint7-rule-overlap.test.ts
          do
            pnpm db:reset
            pnpm db:seed
            pnpm exec vitest run "$spec" --maxWorkers=1 --minWorkers=1
          done
      - name: Sprint 8 benefit invariants and concurrency integration
        run: pnpm db:reset && pnpm db:seed && pnpm exec vitest run tests/integration/sprint8-benefit-invariants.test.ts --maxWorkers=1 --minWorkers=1
      - name: Sprint 8 benefit correctness integration
        shell: bash
        run: |
          set -euo pipefail
          for spec in \
            tests/integration/sprint8-loyalty-tip-boundary.test.ts \
