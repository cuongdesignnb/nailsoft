            tests/integration/sprint10-reserve-fraud-controls.test.ts
          do
            pnpm db:reset
            pnpm db:seed
            pnpm exec vitest run "$spec" --maxWorkers=1 --minWorkers=1
          done
      - name: Reset focused regression fixture
        run: pnpm db:reset && pnpm db:seed
      - name: Public booking tenant-scoped deep integration
        run: pnpm exec vitest run tests/integration/sprint4-public-closure.test.ts
      - name: WebSocket authorization integration
        run: pnpm exec vitest run tests/integration/sprint3-closure-authorization.test.ts
      - name: Durable outbox worker integration
        run: pnpm exec vitest run tests/integration/sprint3-closure-outbox.test.ts
      - name: API contract tests
        run: pnpm test:contract
      - name: Sprint 19 Wave 0 localization and navigation contracts
        run: pnpm test:contract --run tests/contract/sprint19-mojibake-contract.test.ts tests/contract/sprint19-auth-context-contract.test.ts tests/contract/sprint19-navigation-registry.test.ts
      - name: Sprint 19 Wave 0 mobile shell smoke
        run: pnpm exec vitest run tests/mobile/sprint19-wave0-mobile-shell.test.ts
      - name: Reset deterministic E2E fixture
        run: pnpm db:reset && pnpm db:seed
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Start API and durable Worker for authenticated E2E
        shell: bash
        run: |
          set -euo pipefail
          NODE_ENV=development pnpm --filter @nailsoft/api dev > api-e2e.log 2>&1 &
          setsid pnpm --filter @nailsoft/worker dev > worker-e2e.log 2>&1 &
          echo $! > worker-e2e.pid
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/v1/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat api-e2e.log
          exit 1
      - name: Authenticated Sprint 1-4 E2E
        run: >-
          pnpm exec playwright test
          tests/e2e/sprint1-smoke.spec.ts
          tests/e2e/sprint2-authenticated-catalog.spec.ts
          tests/e2e/sprint2-authenticated-leave.spec.ts
          tests/e2e/sprint2-authenticated-shifts.spec.ts
          tests/e2e/sprint2-authenticated-staff.spec.ts
          tests/e2e/sprint2-authorization.spec.ts
          tests/e2e/sprint2-conflicts.spec.ts
          tests/e2e/sprint3-availability-calendar.spec.ts
          tests/e2e/sprint3-closure-functional.spec.ts
          tests/e2e/sprint3-closure-outbox-realtime.spec.ts
          tests/e2e/sprint3-closure-websocket-security.spec.ts
          tests/e2e/sprint4-booking-ui.spec.ts
      - name: Sprint 4 Booking Web policy and multi-service E2E
        run: pnpm exec playwright test tests/e2e/sprint4-booking-ui.spec.ts
      - name: Sprint 3 closure authenticated E2E
        run: pnpm exec playwright test tests/e2e/sprint3-closure
      - name: Mobile Sprint 2-4 integration
        run: pnpm exec playwright test tests/e2e/sprint2-mobile-api.spec.ts tests/e2e/sprint3-availability-calendar.spec.ts tests/e2e/sprint4-booking-ui.spec.ts
      - name: Sprint 5 authenticated operational and mobile E2E
        run: pnpm exec playwright test tests/e2e/sprint5-operations.spec.ts tests/e2e/sprint5-mobile.spec.ts
      - name: Sprint 5 authenticated deep E2E
